name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Download asserts
    - name: Download resources
      run: |
        wget -O /tmp/example.mdx https://mdx.mdict.org/%E6%8C%89%E8%AF%8D%E5%85%B8%E8%AF%AD%E7%A7%8D%E6%9D%A5%E5%88%86%E7%B1%BB/%E8%8B%B1%E8%AF%AD/%E6%99%AE%E9%80%9A%E8%AF%8D%E5%85%B8/%5B%E8%8B%B1-%E6%B1%89%5D/21%E4%B8%96%E7%BA%AA%E5%A4%A7%E8%8B%B1%E6%B1%89%E8%AF%8D%E5%85%B8%EF%BC%8C16-7-5/21%E4%B8%96%E7%BA%AA%E5%A4%A7%E8%8B%B1%E6%B1%89%E8%AF%8D%E5%85%B8.mdx

    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

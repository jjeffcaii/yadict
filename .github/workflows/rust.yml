name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Download asserts
    - name: Download resources
      run: |
        wget -O /tmp/example.mdx 'https://mdx.mdict.org/%E6%8C%89%E8%AF%8D%E5%85%B8%E8%AF%AD%E7%A7%8D%E6%9D%A5%E5%88%86%E7%B1%BB/%E8%8B%B1%E8%AF%AD/%E7%B3%BB%E5%88%97%E8%AF%8D%E5%85%B8/%E9%87%91%E5%B1%B1%E8%AF%8D%E9%9C%B82009/%E9%87%91%E5%B1%B1%E8%AF%8D%E9%9C%B82009%E7%AE%80%E6%98%8E%E8%8B%B1%E6%B1%89%E6%B1%89%E8%8B%B1%E8%AF%8D%E5%85%B8,superfan,20090127.mdx'

    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
